# Upstream FlowKit conventional fluorescence example, not an Aurora/S8 template.
instrument: generic
signal_state: raw_conventional
channels:
  - CD3 APC-H7 FLR-A
  - CD4 PE-Cy7 FLR-A
  - CD8 PerCP-Cy55 FLR-A
  - TNFa FITC FLR-A
  - IL2 BV421 FLR-A
  - IFNg APC FLR-A
  - CD107a PE FLR-A
transform: arcsinh
cofactor: 150.0
clusters: 6
seed: 42
fit_events_per_sample: 20000
plot_events_per_sample: 4000
gates: []
