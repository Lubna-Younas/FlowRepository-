[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-workbench"
version = "0.2.0"
description = "Local research prototype for traceable cytometry QC and exploration"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "flowkit==1.3.2", "numpy>=2.1,<3", "pandas>=2.2,<3",
  "scipy>=1.14,<2", "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4",
  "PyYAML>=6,<7", "streamlit>=1.64,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/Lubna-Younas/FlowRepository-"
Issues = "https://github.com/Lubna-Younas/FlowRepository-/issues"

[project.scripts]
flow-workbench = "flowworkbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
